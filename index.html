<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Wedding QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

</head>

<body>

  <h2>📷 Wedding QR Scanner</h2>

  <p id="status">
    Arahkan kamera ke QR Code undangan
  </p>

  <div id="reader"></div>


  <script>

    let html5QrCode;

    let isScanning = true;


    // URL Wedding Check-in App
    const WEDDING_APP_URL =
      'https://script.google.com/macros/s/AKfycbxRNJvUumDLBz44jpRFk0u35XOVRMmQMwzHfEPJAjloRaNle12_DBjPt8hWuh3QwOfK-Q/exec';


    function startScanner() {

      html5QrCode =
        new Html5Qrcode('reader');


      Html5QrCode.getCameras()

        .then(function(cameras) {

          if (!cameras ||
              cameras.length === 0) {

            showResult(
              '❌ Kamera tidak ditemukan'
            );

            return;

          }


          const cameraId =
            cameras[
              cameras.length - 1
            ].id;


          html5QrCode.start(

            cameraId,

            {
              fps: 10,

              qrbox: {
                width: 250,
                height: 250
              }

            },


            function(qrCodeMessage) {

              if (!isScanning) {
                return;
              }


              isScanning = false;


              document.getElementById(
                'status'
              ).innerHTML =
                '✅ QR berhasil! Membuka data tamu...';


              html5QrCode.stop()


                .then(function() {

                  setTimeout(function() {

                    window.location.href =
                      WEDDING_APP_URL +
                      '?guestId=' +
                      encodeURIComponent(
                        qrCodeMessage
                      );

                  }, 500);

                });

            },


            function(errorMessage) {

              // QR belum ditemukan

            }

          );

        })

        .catch(function(error) {

          showResult(
            '❌ Error kamera: ' +
            error
          );

        });

    }


    function showResult(message) {

      document.body.insertAdjacentHTML(
        'beforeend',
        '<p>' + message + '</p>'
      );

    }


    startScanner();

  </script>

</body>

</html>
