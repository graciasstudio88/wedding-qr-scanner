<script>

function testCamera() {

  document.getElementById('result').innerHTML =
    '⏳ Meminta akses kamera belakang...';

  navigator.mediaDevices
    .getUserMedia({

      video: {
        facingMode: {
          ideal: 'environment'
        }
      },

      audio: false

    })

    .then(function(stream) {

      document.getElementById('result').innerHTML =
        '✅ KAMERA BELAKANG BERHASIL!';

      document.getElementById('video').srcObject =
        stream;

    })

    .catch(function(error) {

      document.getElementById('result').innerHTML =
        '❌ ERROR: ' +
        error.name +
        '<br>' +
        error.message;

    });

}

</script>
