<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Wedding QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

</head>

<body>

  <h2>📷 Wedding QR Scanner</h2>

  <p>Arahkan kamera ke QR Code undangan</p>

  <div id="reader"></div>

  <p id="result">
    Menunggu QR Code...
  </p>


  <script>

    let html5QrCode;


    function startScanner() {

      html5QrCode =
        new Html5Qrcode('reader');


      Html5Qrcode.getCameras()

        .then(function(cameras) {

          if (!cameras ||
              cameras.length === 0) {

            document.getElementById(
              'result'
            ).innerHTML =
              '❌ Kamera tidak ditemukan';

            return;

          }


          const cameraId =
            cameras[
              cameras.length - 1
            ].id;


          html5QrCode.start(

            cameraId,

            {
              fps: 10,

              qrbox: {
                width: 250,
                height: 250
              }

            },


            function(qrCodeMessage) {

              document.getElementById(
                'result'
              ).innerHTML =

                '✅ QR berhasil dibaca!<br><br>' +

                'Guest ID:<br>' +

                '<b>' +
                qrCodeMessage +
                '</b>';


              html5QrCode.stop();

            },


            function(errorMessage) {

              // QR belum ditemukan

            }

          );

        })

        .catch(function(error) {

          document.getElementById(
            'result'
          ).innerHTML =

            '❌ Error kamera:<br>' +

            error;

        });

    }


    startScanner();

  </script>

</body>

</html>
