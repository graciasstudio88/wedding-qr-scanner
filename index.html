<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Wedding QR Scanner</title>


  <!-- QR Scanner Library -->

  <script src="https://unpkg.com/html5-qrcode"></script>


  <style>

    body {

      margin: 0;

      padding: 20px;

      font-family: Arial, sans-serif;

      background: #f5f5f5;

      text-align: center;

    }


    .container {

      max-width: 500px;

      margin: auto;

      background: white;

      padding: 20px;

      border-radius: 15px;

    }


    h1 {

      font-size: 24px;

    }


    button {

      width: 100%;

      padding: 15px;

      margin-top: 15px;

      border: none;

      border-radius: 10px;

      font-size: 16px;

      cursor: pointer;

    }


    #reader {

      margin-top: 20px;

      width: 100%;

    }


    #result {

      margin-top: 20px;

      padding: 15px;

      border-radius: 10px;

      background: #f0f0f0;

      display: none;

    }

  </style>

</head>


<body>


<div class="container">


  <h1>💍 Wedding QR Scanner</h1>


  <p id="status">

    Tekan tombol untuk scan QR Code

  </p>


  <button
    id="scanButton"
    onclick="startScanner()"
  >

    📷 BUKA KAMERA & SCAN QR

  </button>


  <div id="reader"></div>


  <div id="result"></div>


</div>


<script>


let html5QrCode = null;

let isScanning = false;


/*
=====================================

START SCANNER

=====================================
*/


function startScanner() {


  if (isScanning) {

    return;

  }


  isScanning = true;


  document.getElementById(
    'scanButton'
  ).style.display =
    'none';


  document.getElementById(
    'status'
  ).innerHTML =
    '⏳ Membuka kamera belakang...';


  document.getElementById(
    'reader'
  ).innerHTML =
    '<div id="qr-reader"></div>';


  html5QrCode =
    new Html5Qrcode(
      'qr-reader'
    );


  /*
  PAKSA KAMERA BELAKANG
  */


  html5QrCode.start(

    {

      facingMode: {
        exact: 'environment'
      }

    },


    {

      fps: 10,

      qrbox: {

        width: 250,

        height: 250

      }

    },


    function(qrCodeMessage) {


      /*
      QR BERHASIL
      */


      if (!isScanning) {

        return;

      }


      isScanning = false;


      document.getElementById(
        'status'
      ).innerHTML =
        '✅ QR berhasil dibaca!';


      stopScanner();


      showResult(

        '🎉 QR CODE:<br><br>' +

        '<b>' +

        qrCodeMessage +

        '</b>'

      );


    },


    function(errorMessage) {


      /*
      QR BELUM TERBACA

      NORMAL

      */


    }

  )

  .catch(function(error) {


    isScanning = false;


    document.getElementById(
      'status'
    ).innerHTML =
      '❌ Tidak dapat membuka kamera';


    document.getElementById(
      'scanButton'
    ).style.display =
      'block';


    showResult(

      '❌ ERROR:<br><br>' +

      error

    );


  });


}


/*
=====================================

STOP SCANNER

=====================================
*/


function stopScanner() {


  if (!html5QrCode) {

    return;

  }


  html5QrCode

    .stop()

    .then(function() {


      document.getElementById(
        'reader'
      ).innerHTML =
        '';


    })


    .catch(function(error) {


      console.log(
        error
      );


    });


}


/*
=====================================

SHOW RESULT

=====================================
*/


function showResult(message) {


  const result =
    document.getElementById(
      'result'
    );


  result.style.display =
    'block';


  result.innerHTML =
    message;


}


</script>


</body>

</html>
