<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Wedding QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
    }

    h1 {
      font-size: 24px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    #reader {
      margin-top: 20px;
      width: 100%;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #f0f0f0;
      display: none;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>💍 Wedding QR Scanner</h1>

  <p id="status">
    Tekan tombol untuk scan QR Souvenir
  </p>

  <button
    id="scanButton"
    onclick="startScanner()"
  >
    🎁 SCAN QR SOUVENIR
  </button>

  <div id="reader"></div>

  <div id="result"></div>

</div>


<script>


let html5QrCode = null;

let isScanning = false;


/*
=====================================
APPS SCRIPT URL TERBARU
=====================================
*/

const WEDDING_APP_URL =
  'https://script.google.com/macros/s/AKfycbyj7vpd3qCD3rHUIrNruLF7CyrS9uGWl4P_u9RJ0f-6eMS3WS2KE2zRoWfmmuMtj2cLLA/exec';


/*
=====================================
START QR SCANNER
=====================================
*/

function startScanner() {

  if (isScanning) {
    return;
  }


  isScanning = true;


  document.getElementById(
    'scanButton'
  ).style.display = 'none';


  document.getElementById(
    'status'
  ).innerHTML =
    '⏳ Membuka kamera belakang...';


  document.getElementById(
    'reader'
  ).innerHTML =
    '<div id="qr-reader"></div>';


  html5QrCode =
    new Html5Qrcode(
      'qr-reader'
    );


  html5QrCode.start(

    {
      facingMode: {
        exact: 'environment'
      }
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }
    },


    function(qrCodeMessage) {


      if (!isScanning) {
        return;
      }


      isScanning = false;


      document.getElementById(
        'status'
      ).innerHTML =
        '⏳ QR berhasil! Memproses souvenir...';


      html5QrCode.stop()

        .then(function() {

          setTimeout(function() {


            /*
            REDIRECT KE APPS SCRIPT
            */

            window.location.href =
              WEDDING_APP_URL +
              '?souvenirId=' +
              encodeURIComponent(
                qrCodeMessage
              );


          }, 500);

        })


        .catch(function(error) {

          console.log(error);


          /*
          TETAP REDIRECT
          */

          window.location.href =
            WEDDING_APP_URL +
            '?souvenirId=' +
            encodeURIComponent(
              qrCodeMessage
            );

        });


    },


    function(errorMessage) {

      // QR belum terbaca
      // Normal

    }

  )


  .catch(function(error) {


    isScanning = false;


    document.getElementById(
      'status'
    ).innerHTML =
      '❌ Tidak dapat membuka kamera';


    document.getElementById(
      'scanButton'
    ).style.display =
      'block';


    showResult(
      '❌ ERROR KAMERA:<br><br>' +
      String(error)
    );


  });

}


/*
=====================================
SHOW RESULT
=====================================
*/

function showResult(message) {

  const result =
    document.getElementById(
      'result'
    );


  result.style.display =
    'block';


  result.innerHTML =
    message;

}


</script>

</body>

</html>
