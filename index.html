<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Wedding QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

</head>

<body>

  <h2>📷 Wedding QR Scanner</h2>

  <p id="status">
    Arahkan kamera ke QR Code undangan
  </p>

  <div id="reader"></div>

  <div id="result"></div>


  <script>

    let html5QrCode;

    let isScanning = true;


    // URL Apps Script API
    const API_URL =
      'https://script.google.com/macros/s/AKfycbyOWv11eweNekfzqmhGRCp4n7TYhaomqBWIDfuCdyce/exec';


    function startScanner() {

      html5QrCode =
        new Html5Qrcode('reader');


      Html5Qrcode.getCameras()

        .then(function(cameras) {

          if (!cameras ||
              cameras.length === 0) {

            showResult(
              '❌ Kamera tidak ditemukan'
            );

            return;

          }


          const cameraId =
            cameras[
              cameras.length - 1
            ].id;


          html5QrCode.start(

            cameraId,

            {
              fps: 10,

              qrbox: {
                width: 250,
                height: 250
              }

            },


            function(qrCodeMessage) {

              if (!isScanning) {
                return;
              }


              isScanning = false;


              document.getElementById(
                'status'
              ).innerHTML =
                '⏳ Mencari data tamu...';


              html5QrCode.stop();


              getGuestName(
                qrCodeMessage
              );

            },


            function(errorMessage) {

              // QR belum ditemukan

            }

          );

        })

        .catch(function(error) {

          showResult(
            '❌ Error kamera: ' +
            error
          );

        });

    }


    function getGuestName(guestId) {

      const url =
        API_URL +
        '?action=getGuest' +
        '&guestId=' +
        encodeURIComponent(guestId);


      fetch(url)

        .then(function(response) {

          return response.json();

        })

        .then(function(data) {

          if (!data.success) {

            showResult(
              '❌ Guest tidak ditemukan'
            );

            return;

          }


          document.getElementById(
            'status'
          ).innerHTML =
            '✅ QR berhasil dibaca';


          document.getElementById(
            'result'
          ).innerHTML =

            '<h1>👤 ' +
            data.guestName +
            '</h1>' +

            '<p>Silakan lanjutkan ke proses check-in</p>';

        })

        .catch(function(error) {

          showResult(
            '❌ Gagal mengambil data tamu: ' +
            error
          );

        });

    }


    function showResult(message) {

      document.getElementById(
        'result'
      ).innerHTML =
        message;

    }


    startScanner();

  </script>

</body>

</html>
