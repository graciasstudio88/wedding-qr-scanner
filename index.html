<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Wedding QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

</head>


<body>

  <h2>📷 Wedding QR Scanner</h2>

  <p id="status">
    Tekan tombol untuk membuka kamera
  </p>


  <button
    id="cameraButton"
    onclick="startScanner()"
  >
    📷 BUKA KAMERA
  </button>


  <div id="reader"></div>


  <script>

    let html5QrCode = null;

    let isScanning = false;


    const WEDDING_APP_URL =
      'https://script.google.com/macros/s/AKfycbxRNJvUumDLBz44jpRFk0u35XOVRMmQMwzHfEPJAjloRaNle12_DBjPt8hWuh3QwOfK-Q/exec';


    function startScanner() {

      // Jangan buka kamera dua kali
      if (isScanning) {
        return;
      }


      isScanning = true;


      document.getElementById(
        'status'
      ).innerHTML =
        '⏳ Meminta akses kamera...';


      document.getElementById(
        'cameraButton'
      ).style.display =
        'none';


      html5QrCode =
        new Html5Qrcode('reader');


      html5QrCode.start(

        {
          facingMode: {
            ideal: 'environment'
          }
        },

        {
          fps: 10,

          qrbox: {
            width: 250,
            height: 250
          }
        },


        function(qrCodeMessage) {

          if (!isScanning) {
            return;
          }


          isScanning = false;


          document.getElementById(
            'status'
          ).innerHTML =
            '✅ QR berhasil! Membuka data tamu...';


          html5QrCode.stop()

            .then(function() {

              redirectToWeddingApp(
                qrCodeMessage
              );

            })

            .catch(function() {

              redirectToWeddingApp(
                qrCodeMessage
              );

            });

        },


        function(errorMessage) {

          // QR belum ditemukan
          // Tidak perlu tampilkan error

        }

      )

      .catch(function(error) {

        isScanning = false;


        document.getElementById(
          'status'
        ).innerHTML =
          '❌ Tidak dapat membuka kamera: ' +
          error.name;


        document.getElementById(
          'cameraButton'
        ).style.display =
          'block';

      });

    }


    function redirectToWeddingApp(guestId) {

      window.location.href =
        WEDDING_APP_URL +
        '?guestId=' +
        encodeURIComponent(guestId);

    }

  </script>

</body>

</html>
